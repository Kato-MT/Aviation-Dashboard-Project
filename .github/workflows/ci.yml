name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 22

jobs:
  native-validation:
    name: Native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and tests
        run: pnpm validate

      - name: Build production application
        run: pnpm build

  core-coverage:
    name: Core branch coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage gate
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  build-artifacts:
    name: Normal and offline builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check requirements traceability
        run: pnpm requirements:check

      - name: Build Pages artifact
        run: pnpm build

      - name: Build self-contained offline artifact
        run: pnpm build:offline

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: builds-${{ github.sha }}
          path: |
            dist
            dist-offline
            dist-offline.html
          if-no-files-found: error
          retention-days: 14

  browser-assurance:
    name: Browser, accessibility, offline, and responsive
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build normal and offline applications
        run: |
          pnpm build
          pnpm build:offline

      - name: Run browser assurance suite
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  temporal-evidence:
    name: Temporal model, campaign, and analytics evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set deterministic evidence timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce model artifacts and parity evidence
        run: |
          pnpm ml:train
          git diff --exit-code -- \
            models/robust_covariance_v1.json \
            models/evaluation_v1.json \
            models/inference_parity_v1.json \
            models/MODEL_CARD.md \
            models/model_configuration_manifest_v1.json \
            models/temporal_fault_model_v1.json \
            models/temporal_evaluation_v1.json \
            models/temporal_inference_parity_v1.json \
            models/TEMPORAL_MODEL_CARD.md \
            models/temporal_fault_model_v2.json \
            models/temporal_evaluation_v2.json \
            models/temporal_inference_parity_v2.json \
            models/TEMPORAL_INTEGRATION_MODEL_CARD.md

      - name: Run temporal benchmark and campaign evidence
        run: |
          pnpm benchmark:temporal
          pnpm campaign:report

      - name: Verify temporal campaign history
        run: |
          python tools/analytics/temporal_campaign.py migrate
          python tools/analytics/temporal_campaign.py ingest artifacts/temporal-campaign-report.json
          python tools/analytics/temporal_campaign.py integrity > analytics/temporal-campaign-integrity.json
          node scripts/release/verify-integrity-report.mjs analytics/temporal-campaign-integrity.json
          python tools/analytics/temporal_campaign.py report > analytics/temporal-campaign-history.json

      - name: Upload temporal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporal-evidence-${{ github.sha }}
          path: |
            artifacts/temporal-campaign-report.json
            analytics/temporal-campaign-history.json
            analytics/temporal-campaign-integrity.json
            benchmark/temporal-latest.json
            docs/benchmarks-temporal.md
            models/model_configuration_manifest_v1.json
            models/temporal_*.json
            models/TEMPORAL_MODEL_CARD.md
            models/TEMPORAL_INTEGRATION_MODEL_CARD.md
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: High and critical dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high

  development-container:
    name: Optional development container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and validate the pinned development container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            pnpm validate
            pnpm build
            pnpm build:offline

  ci-required:
    name: CI required
    if: always()
    needs:
      - native-validation
      - core-coverage
      - build-artifacts
      - browser-assurance
      - temporal-evidence
      - dependency-audit
      - development-container
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required jobs succeeded
        shell: bash
        run: |
          test "${{ needs.native-validation.result }}" = "success"
          test "${{ needs.core-coverage.result }}" = "success"
          test "${{ needs.build-artifacts.result }}" = "success"
          test "${{ needs.browser-assurance.result }}" = "success"
          test "${{ needs.temporal-evidence.result }}" = "success"
          test "${{ needs.dependency-audit.result }}" = "success"
          test "${{ needs.development-container.result }}" = "success"
