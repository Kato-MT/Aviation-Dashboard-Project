name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 22

jobs:
  native-validation:
    name: Native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and tests
        run: pnpm validate

      - name: Build production application
        run: pnpm build

  core-coverage:
    name: Core branch coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage gate
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  build-artifacts:
    name: Normal and offline builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check requirements traceability
        run: pnpm requirements:check

      - name: Build Pages artifact
        run: pnpm build

      - name: Build self-contained offline artifact
        run: pnpm build:offline

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: builds-${{ github.sha }}
          path: |
            dist
            dist-offline
            dist-offline.html
          if-no-files-found: error
          retention-days: 14

  browser-assurance:
    name: Browser, accessibility, offline, and responsive
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build normal and offline applications
        run: |
          pnpm build
          pnpm build:offline

      - name: Run browser assurance suite
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: High and critical dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high

  ci-required:
    name: CI required
    if: always()
    needs:
      - native-validation
      - core-coverage
      - build-artifacts
      - browser-assurance
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required jobs succeeded
        shell: bash
        run: |
          test "${{ needs.native-validation.result }}" = "success"
          test "${{ needs.core-coverage.result }}" = "success"
          test "${{ needs.build-artifacts.result }}" = "success"
          test "${{ needs.browser-assurance.result }}" = "success"
          test "${{ needs.dependency-audit.result }}" = "success"
