name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - feat/live-airspace-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 22

jobs:
  native-validation:
    name: Native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and tests
        run: pnpm validate

      - name: Build production application
        run: pnpm build

  core-coverage:
    name: Core branch coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage gate
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  build-artifacts:
    name: Normal and offline builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check requirements traceability and evidence paths
        run: |
          pnpm requirements:check
          node scripts/release/verify-traceability.mjs --require-evidence-paths

      - name: Build Pages artifact
        run: pnpm build

      - name: Build self-contained offline artifact
        run: pnpm build:offline

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: builds-${{ github.sha }}
          path: |
            dist
            dist-offline
            dist-offline.html
          if-no-files-found: error
          retention-days: 14

  browser-assurance:
    name: Browser, accessibility, offline, and responsive
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build normal and offline applications
        run: |
          pnpm build
          pnpm build:offline

      - name: Run browser assurance suite
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  live-performance-assurance:
    name: Live browser performance assurance
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore integrity-keyed regional map inputs
        id: live-performance-map-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .map-data/georgia-20260828-z12
            .tmp-tests/map-preparation
          key: live-performance-map-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('maps/recipe.json', 'maps/manifest.json', 'maps/style.json', 'tools/maps/prepare.ts', 'tools/maps/cliRelease.ts', 'tools/maps/manifest.ts', 'pnpm-lock.yaml') }}

      - name: Prepare pinned regional map inputs on cache miss
        if: steps.live-performance-map-cache.outputs.cache-hit != 'true'
        run: |
          pnpm maps:prepare
          pnpm maps:manifest
          git diff --exit-code -- maps/manifest.json maps/style.json

      - name: Install Chromium and Linux browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Enforce strict Live browser performance budgets
        run: pnpm test:browser-performance

      - name: Upload aggregate Live browser performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-performance-${{ github.sha }}
          path: test-results/live-performance
          if-no-files-found: warn
          retention-days: 14

  live-assurance:
    name: Live airspace assurance
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      M34_CANDIDATE_DIRECTORY: .tmp-tests/retained-m34
      M34_SELECTION_RECORD_PATH: .tmp-tests/retained-m34.selection.json
      M34_EXPECTED_SOURCE_HEAD: ${{ github.sha }}
      M34_JUNIT_PATH: test-results/m34-entry-artifact/results.xml
      M34_RUNBOOK_RECEIPT_PATH: test-results/m34-entry-artifact/runbook-rehearsal.json
      M34_RECEIPT_PATH: test-results/m34-entry-artifact/acceptance.json
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore integrity-keyed regional map inputs
        id: live-map-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .map-data/georgia-20260828-z12
            .tmp-tests/map-preparation
          key: live-map-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('maps/recipe.json', 'maps/manifest.json', 'maps/style.json', 'tools/maps/prepare.ts', 'tools/maps/cliRelease.ts', 'tools/maps/manifest.ts', 'tools/maps/seed.ts', 'tools/maps/wrangler.seed.json', 'pnpm-lock.yaml') }}

      - name: Prepare pinned regional map inputs on cache miss
        if: steps.live-map-cache.outputs.cache-hit != 'true'
        run: |
          pnpm maps:prepare
          pnpm maps:manifest
          git diff --exit-code -- maps/manifest.json maps/style.json

      - name: Seed fresh local-only map storage
        run: pnpm maps:seed

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Build isolated Live artifacts once and inspect them
        run: |
          pnpm build:live
          pnpm build:mock-staging
          pnpm verify:live-builds

      - name: Enforce local R3 privacy and browser quality gates
        run: |
          pnpm privacy:verify
          pnpm runbooks:verify
          pnpm browser:budgets
          pnpm test:visual-regression

      - name: Dry-run the built production Worker
        run: pnpm worker:dry-run

      - name: Generate the candidate SBOM without rebuilding
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pnpm sbom:generate

      - name: Retain the exact mock-staging candidate
        id: retain-candidate
        shell: pwsh
        run: |
          $retentionOutput = @(pnpm candidate:retain --output "$env:M34_CANDIDATE_DIRECTORY" --selection-record "$env:M34_SELECTION_RECORD_PATH")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $retentionOutput | ForEach-Object { Write-Output $_ }
          # Trust boundary: the runner and GitHub step-output channel are assumed uncompromised.
          $selectionLines = @($retentionOutput | Where-Object { $_ -like 'M34_CANDIDATE_SELECTION *' })
          if ($selectionLines.Count -ne 1) { throw 'Retention did not emit one trusted selection identity.' }
          $selection = $selectionLines[0].Substring('M34_CANDIDATE_SELECTION '.Length) | ConvertFrom-Json
          if ($selection.selectionRecordSha256 -notmatch '^[a-f0-9]{64}$') { throw 'Retention emitted an invalid selection SHA-256.' }
          "selection_sha256=$($selection.selectionRecordSha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify the retained candidate before execution
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm candidate:verify "$env:M34_CANDIDATE_DIRECTORY" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA" --expected-target mock-staging

      - name: Run candidate-bound local workerd load smoke gate
        timeout-minutes: 15
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm live:load:candidate:smoke --candidate-directory "$env:M34_CANDIDATE_DIRECTORY"

      - name: Reverify the unchanged candidate after load execution
        if: ${{ always() && steps.retain-candidate.outcome == 'success' }}
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm candidate:verify "$env:M34_CANDIDATE_DIRECTORY" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA" --expected-target mock-staging

      - name: Browser-test the retained full-stack candidate with zero retries
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm test:m34-artifact

      - name: Reverify the unchanged candidate after browser execution
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm candidate:verify "$env:M34_CANDIDATE_DIRECTORY" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA" --expected-target mock-staging

      - name: Rehearse all candidate-bound operator runbooks locally
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm runbooks:rehearse:candidate "$env:M34_CANDIDATE_DIRECTORY" --output "$env:M34_RUNBOOK_RECEIPT_PATH" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA"

      - name: Record the candidate-bound acceptance receipt
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm candidate:acceptance "$env:M34_CANDIDATE_DIRECTORY" "$env:M34_JUNIT_PATH" "$env:M34_RUNBOOK_RECEIPT_PATH" --output "$env:M34_RECEIPT_PATH" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA"

      - name: Reverify that receipt creation did not mutate the candidate
        shell: pwsh
        env:
          M34_EXPECTED_SELECTION_SHA256: ${{ steps.retain-candidate.outputs.selection_sha256 }}
        run: pnpm candidate:verify "$env:M34_CANDIDATE_DIRECTORY" --selection-record "$env:M34_SELECTION_RECORD_PATH" --expected-selection-sha256 "$env:M34_EXPECTED_SELECTION_SHA256" --expected-source-head "$env:GITHUB_SHA" --expected-target mock-staging

      - name: Upload exact M3.4 candidate and acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retained-m34-${{ github.sha }}
          path: |
            .tmp-tests/retained-m34
            .tmp-tests/retained-m34.selection.json
            test-results/m34-entry-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Run actual Live browser assurance
        run: |
          pnpm test:live-browser
          pnpm test:live-flow
          pnpm test:m3-walkthrough

      - name: Evaluate the bounded capacity model
        run: pnpm live:capacity

      - name: Upload Live assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-assurance-${{ github.sha }}
          path: |
            test-results/live
            test-results/live-flow
            test-results/visual-regression
            test-results/live-load
            build/test-results/m3-walkthrough
            .tmp-tests/worker-dry-run
            !.tmp-tests/worker-dry-run/**/*.map
            dist-live/airspace_worker/wrangler.json
            dist-mock-staging/airspace_worker/wrangler.json
            dist-mock-staging/mock_provider/wrangler.json
          if-no-files-found: warn
          retention-days: 14

  temporal-evidence:
    name: Temporal model, campaign, and analytics evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set deterministic evidence timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce model artifacts and parity evidence
        run: |
          pnpm ml:train
          git diff --exit-code -- \
            models/robust_covariance_v1.json \
            models/evaluation_v1.json \
            models/inference_parity_v1.json \
            models/MODEL_CARD.md \
            models/model_configuration_manifest_v1.json \
            models/temporal_fault_model_v1.json \
            models/temporal_evaluation_v1.json \
            models/temporal_inference_parity_v1.json \
            models/TEMPORAL_MODEL_CARD.md \
            models/temporal_fault_model_v2.json \
            models/temporal_evaluation_v2.json \
            models/temporal_inference_parity_v2.json \
            models/TEMPORAL_INTEGRATION_MODEL_CARD.md

      - name: Run temporal benchmark and campaign evidence
        run: |
          pnpm benchmark:temporal
          pnpm campaign:report

      - name: Verify temporal campaign history
        run: |
          python tools/analytics/temporal_campaign.py migrate
          python tools/analytics/temporal_campaign.py ingest artifacts/temporal-campaign-report.json
          python tools/analytics/temporal_campaign.py integrity > analytics/temporal-campaign-integrity.json
          node scripts/release/verify-integrity-report.mjs analytics/temporal-campaign-integrity.json
          python tools/analytics/temporal_campaign.py report > analytics/temporal-campaign-history.json

      - name: Upload temporal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporal-evidence-${{ github.sha }}
          path: |
            artifacts/temporal-campaign-report.json
            analytics/temporal-campaign-history.json
            analytics/temporal-campaign-integrity.json
            benchmark/temporal-latest.json
            docs/benchmarks-temporal.md
            models/model_configuration_manifest_v1.json
            models/temporal_*.json
            models/TEMPORAL_MODEL_CARD.md
            models/TEMPORAL_INTEGRATION_MODEL_CARD.md
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: High and critical dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high

  development-container:
    name: Optional development container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Build and validate the pinned development container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            pnpm validate
            pnpm build
            pnpm build:offline

  ci-required:
    name: CI required
    if: always()
    needs:
      - native-validation
      - core-coverage
      - build-artifacts
      - browser-assurance
      - live-performance-assurance
      - live-assurance
      - temporal-evidence
      - dependency-audit
      - development-container
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required jobs succeeded
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          LIVE_PERFORMANCE_RESULT: ${{ needs.live-performance-assurance.result }}
          LIVE_ASSURANCE_RESULT: ${{ needs.live-assurance.result }}
        run: |
          test "${{ needs.native-validation.result }}" = "success"
          test "${{ needs.core-coverage.result }}" = "success"
          test "${{ needs.build-artifacts.result }}" = "success"
          test "${{ needs.browser-assurance.result }}" = "success"
          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" != "refs/heads/main" ]]; then
            test "$LIVE_PERFORMANCE_RESULT" = "skipped"
            test "$LIVE_ASSURANCE_RESULT" = "skipped"
          else
            test "$LIVE_PERFORMANCE_RESULT" = "success"
            test "$LIVE_ASSURANCE_RESULT" = "success"
          fi
          test "${{ needs.temporal-evidence.result }}" = "success"
          test "${{ needs.dependency-audit.result }}" = "success"
          test "${{ needs.development-container.result }}" = "success"
