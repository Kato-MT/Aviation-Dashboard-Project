name: Pages publication firebreak

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful CI run that retained the proposed production candidate
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit expected in that candidate
        required: true
        type: string
      confirm_cutover:
        description: I understand public v3 cutover still requires G3 approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-publication-firebreak
  cancel-in-progress: false

jobs:
  publication-paused:
    name: Public cutover remains paused
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publication until the production-candidate and G3 gates exist
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_cutover }}" != "true" ]]; then
            echo "Public cutover was not explicitly confirmed."
            exit 1
          fi
          echo "Pages publication is paused. M3.4 retains mock-staging evidence only."
          echo "A later G3 workflow must download the named CI artifact, verify source SHA ${{ inputs.source_sha }}, and deploy without rebuilding."
          echo "Requested CI run: ${{ inputs.candidate_run_id }}"
          exit 1
