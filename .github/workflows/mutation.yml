name: Mutation assurance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Deterministic core mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mutation-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_mutation=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(src/(adapters|core|faults)/|tests/core/|stryker\.config\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/mutation\.yml$)'; then
            echo "run_mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_mutation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record skipped mutation scope
        if: steps.changes.outputs.run_mutation != 'true'
        run: echo "No mutation-relevant files changed."

      - name: Set up Node.js
        if: steps.changes.outputs.run_mutation == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned pnpm
        if: steps.changes.outputs.run_mutation == 'true'
        run: npm install --global pnpm@11.9.0

      - name: Install frozen dependencies
        if: steps.changes.outputs.run_mutation == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run mutation gate
        if: steps.changes.outputs.run_mutation == 'true'
        run: pnpm mutation

      - name: Upload mutation report
        if: always() && steps.changes.outputs.run_mutation == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation
          if-no-files-found: warn
          retention-days: 14
