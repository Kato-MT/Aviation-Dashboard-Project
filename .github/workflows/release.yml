name: Release

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 22

jobs:
  verify-build-release:
    name: Verify, attest, and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        if: github.ref_type != 'tag'
        run: |
          echo "Release publication requires a pushed version tag."
          exit 1

      - name: Check out exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the protected main commit and matching package version
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set deterministic evidence timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation and coverage gates
        run: |
          pnpm validate
          pnpm test:coverage

      - name: Require test evidence roots for traceability
        run: node scripts/release/verify-traceability.mjs --require-evidence-paths

      - name: Audit high and critical dependency vulnerabilities
        run: pnpm audit --audit-level high

      - name: Build normal and offline artifacts
        run: |
          pnpm build
          pnpm build:offline

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser assurance suite
        run: pnpm test:e2e

      - name: Capture exact-tag screenshots
        shell: bash
        run: |
          pnpm dev > /tmp/fdw-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/Aviation-Dashboard-Project/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/Aviation-Dashboard-Project/ > /dev/null
          pnpm screenshots

      - name: Refresh expanded model and benchmark evidence
        if: startsWith(github.ref_name, 'v2.1.') || startsWith(github.ref_name, 'v2.2.')
        run: |
          pnpm ml:train
          git diff --exit-code -- \
            models/robust_covariance_v1.json \
            models/evaluation_v1.json \
            models/inference_parity_v1.json \
            models/MODEL_CARD.md
          pnpm benchmark

      - name: Refresh v2.2 temporal evidence
        if: startsWith(github.ref_name, 'v2.2.')
        run: |
          git diff --exit-code -- \
            models/model_configuration_manifest_v1.json \
            models/temporal_fault_model_v1.json \
            models/temporal_evaluation_v1.json \
            models/temporal_inference_parity_v1.json \
            models/TEMPORAL_MODEL_CARD.md \
            models/temporal_fault_model_v2.json \
            models/temporal_evaluation_v2.json \
            models/temporal_inference_parity_v2.json \
            models/TEMPORAL_INTEGRATION_MODEL_CARD.md
          pnpm benchmark:temporal
          pnpm campaign:report

      - name: Generate exact-commit verification report
        run: pnpm release:report

      - name: Generate expanded verification-history analytics
        if: startsWith(github.ref_name, 'v2.1.') || startsWith(github.ref_name, 'v2.2.')
        run: |
          python tools/analytics/analytics.py migrate
          python tools/analytics/analytics.py ingest artifacts/verification-report.json
          python tools/analytics/analytics.py import-benchmarks benchmark/latest.json
          python tools/analytics/analytics.py import-model models/evaluation_v1.json
          python tools/analytics/analytics.py integrity > analytics/verification-history-integrity.json
          node scripts/release/verify-integrity-report.mjs analytics/verification-history-integrity.json
          python tools/analytics/analytics.py report --output analytics/latest-report.md

      - name: Generate v2.2 campaign-history analytics
        if: startsWith(github.ref_name, 'v2.2.')
        run: |
          python tools/analytics/temporal_campaign.py migrate
          python tools/analytics/temporal_campaign.py ingest artifacts/temporal-campaign-report.json
          python tools/analytics/temporal_campaign.py integrity > analytics/temporal-campaign-integrity.json
          node scripts/release/verify-integrity-report.mjs analytics/temporal-campaign-integrity.json
          python tools/analytics/temporal_campaign.py report > analytics/temporal-campaign-history.json

      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out dist/sbom.cdx.json

      - name: Assemble release evidence
        run: node scripts/release/assemble-release.mjs "$GITHUB_REF_NAME"

      - name: Archive Pages build
        run: tar --create --gzip --file release/pages-build.tar.gz --directory dist .

      - name: Generate and verify checksums
        run: |
          node scripts/release/generate-checksums.mjs release
          node scripts/release/verify-release.mjs release "$GITHUB_REF_NAME"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 90

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file "docs/release-notes-$GITHUB_REF_NAME.md" --title "Flight Diagnostics Workbench $GITHUB_REF_NAME"
