name: Release

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 22

jobs:
  verify-build-release:
    name: Verify, attest, and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        if: github.ref_type != 'tag'
        run: |
          echo "Release publication requires a pushed version tag."
          exit 1

      - name: Check out exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation and coverage gates
        run: |
          pnpm validate
          pnpm test:coverage

      - name: Require test evidence roots for traceability
        run: node scripts/release/verify-traceability.mjs --require-evidence-paths

      - name: Audit high and critical dependency vulnerabilities
        run: pnpm audit --audit-level high

      - name: Build normal and offline artifacts
        run: |
          pnpm build
          pnpm build:offline

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser assurance suite
        run: pnpm test:e2e

      - name: Refresh v2.1 model and benchmark evidence
        if: startsWith(github.ref_name, 'v2.1.')
        run: |
          pnpm ml:train
          pnpm benchmark

      - name: Generate exact-commit verification report
        run: pnpm release:report

      - name: Generate v2.1 verification-history analytics
        if: startsWith(github.ref_name, 'v2.1.')
        run: |
          python tools/analytics/analytics.py migrate
          python tools/analytics/analytics.py ingest artifacts/verification-report.json
          python tools/analytics/analytics.py import-benchmarks benchmark/latest.json
          python tools/analytics/analytics.py import-model models/evaluation_v1.json
          python tools/analytics/analytics.py integrity
          python tools/analytics/analytics.py report

      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out dist/sbom.cdx.json

      - name: Assemble release evidence
        run: node scripts/release/assemble-release.mjs "$GITHUB_REF_NAME"

      - name: Archive Pages build
        run: tar --create --gzip --file release/pages-build.tar.gz --directory dist .

      - name: Generate and verify checksums
        run: |
          node scripts/release/generate-checksums.mjs release
          node scripts/release/verify-release.mjs release "$GITHUB_REF_NAME"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 90

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Flight Diagnostics Workbench $GITHUB_REF_NAME"
