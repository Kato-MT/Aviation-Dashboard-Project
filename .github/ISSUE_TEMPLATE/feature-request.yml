name: Feature request
description: Propose a focused, evidence-backed workbench improvement.
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals organization-neutral and limited to synthetic, unclassified demonstration data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What verified user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Testable outcome
      description: State observable acceptance criteria and likely stable requirement IDs.
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Proposed release
      options:
        - v2.0 deterministic release
        - v2.1 expansion after v2.0 stability
        - Later or unplanned
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and tradeoffs
      description: Cover validation, evidence, accessibility, security, compatibility, and maintenance impact.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope checks
      options:
        - label: This proposal uses only synthetic, unclassified data and neutral profiles.
          required: true
        - label: This proposal does not add affiliation, operational, safety, maintenance, or certification claims.
          required: true
        - label: This proposal does not make an experimental model authoritative.
          required: true
